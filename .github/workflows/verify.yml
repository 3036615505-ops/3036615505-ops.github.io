name: verify

# 为什么要有 CI：pre-push 钩子只对「配过 core.hooksPath 的那个 clone」生效。
# 换一台机器（比如 Mac 上）、或者直接改线上文件，钩子一次都不会跑。
# 这里把同一套检查放到服务端，谁的机器、什么时间推的，都照样检查。
#
# 检查内容与本地钩子一一对应（钩子 9 项；typecheck 只在这里跑），外加一套真浏览器端到端测试：
#   ① 全站 ?v= 是否统一          ② 资源内容变了但缓存键没变？（改了 CSS/JS 忘了升版）
#   ③ SW 预缓存条目存在、引用闭环 ④ 楷体子集是否覆盖正文用字
#   ⑤ 章节正文与 manuscript/ 源稿是否一致    ⑥ 安装包与 version.json 是否一致
#   ⑦ content/*.json 与站点逐字自洽（内容契约）
#   ⑧ store 之外没有新增 localStorage 直写（棘轮）   ⑨ HANDOVER 里的数字与代码一致
#   ⑩ 类型检查（jsconfig.json）   ⑪ 阅读器端到端断言全套（无头 Chrome 驱动真页面）
#
# ② 在 CI 里是**事后闹钟**而不是闸门 —— 跑到这一步时东西已经上线了。它真正的价值是
# 兜住「钩子没装 / 用了 --no-verify」的推送；能在发版前拦住它的是 .githooks/pre-push。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 只读即可：这套检查不需要写仓库的权限
permissions:
  contents: read

# 连续推送时只跑最新那一次。端到端一轮约 3 分钟，上一次推送的结果已经没有意义，
# 排队等着它只会拖慢「推上去 → 看到红灯」的反馈，也白烧 Actions 分钟数。
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: 静态校验
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth: 0 —— 步骤②要用 github.event.before 当比较基准，
      # 浅克隆（默认 depth 1）里那个提交根本不存在，检查会静默跳过。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: ① 全站 ?v= 版本号统一
        run: node tools/bump-assets.mjs --check

      # --since 用「本次推送之前的分支顶端」：只比这一次真正要发布的差异。
      # 没有 before（首次推送 / PR 事件）时脚本会退回 @{upstream} 或 origin/main，
      # 都不可用则打印一行说明并退出 0 —— 绝不因为「git 不认识基准」把 CI 弄红。
      - name: ② 资源内容变了但缓存键没变
        run: node tools/bump-assets.mjs --stale --since "${{ github.event.before }}"

      - name: ③ SW 预缓存条目、脚本引用与引用闭环
        run: node tools/check-precache.mjs

      - name: ④ 楷体子集覆盖正文用字
        run: python tools/make-kai-subset.py --check

      - name: ⑤ 章节正文与 manuscript/ 源稿一致
        run: node tools/manuscript-sync.mjs

      - name: ⑥ 安装包与 version.json 一致
        run: node tools/check-apk.mjs

      - name: ⑦ 内容契约逐字自洽
        run: node tools/check-content.mjs

      - name: ⑧ 存储：store 之外没有新增 localStorage 直写
        run: node tools/check-storage-boundary.mjs

      - name: ⑨ 文档：HANDOVER 里的数字与代码一致
        run: node tools/check-docs.mjs

      # 只放在 CI、不放进 pre-push：它靠 npx 联网取 typescript，本地钩子不该依赖网络。
      # 以前靠人记得手跑（CHANGELOG 里每次手写「typecheck 0 诊断」），漏了也没人知道。
      - name: ⑩ 类型检查（jsconfig.json）
        run: npx -y -p typescript tsc -p jsconfig.json --noEmit

  e2e:
    name: 端到端（真浏览器）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 镜像自带的 Chrome 会随 runner 镜像滚动，今天能跑明天可能起不来；
      # 这里额外装一份官方 stable，用 CHROME_BIN 显式指过去，让 e2e 不依赖镜像内容。
      # install-dependencies：把 Chrome 缺的系统库一起 apt 装上 —— 「浏览器起不来」
      # 最常见的原因就是新版镜像里少了 libnss3 / libatk 之类的依赖。
      # continue-on-error：装不上就退回镜像自带的那份（e2e 自己会找），不拖垮整个 job。
      - name: 安装 Chrome（失败则用镜像自带）
        id: setup-chrome
        continue-on-error: true
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: 记录浏览器版本（排障用）
        run: |
          echo "CHROME_BIN=${{ steps.setup-chrome.outputs.chrome-path }}"
          "${{ steps.setup-chrome.outputs.chrome-path || '/usr/bin/google-chrome' }}" --version || true

      - name: ⑪ 阅读器端到端
        # timeout-minutes 是死线的第二道保险：e2e 自己 7 分钟会超时退出，
        # 万一卡在 Node 还没接管的地方（Chrome 起不来、apt 卡住），也不至于
        # 一路耗到 GitHub 的 6 小时上限才被 cancel —— 那种日志什么都查不出来。
        timeout-minutes: 10
        run: node tools/e2e.mjs
        env:
          CI: true
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
