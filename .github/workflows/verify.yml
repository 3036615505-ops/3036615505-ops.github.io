name: verify

# 为什么要有 CI：pre-push 钩子只对「配过 core.hooksPath 的那个 clone」生效。
# 换一台机器（比如 Mac 上）、或者直接改线上文件，钩子一次都不会跑。
# 这里把同一套检查放到服务端，谁的机器、什么时间推的，都照样检查。
#
# 检查内容与本地钩子一一对应，外加一套真浏览器端到端测试：
#   ① 全站 ?v= 是否统一          ② SW 预缓存条目是否都存在
#   ③ 楷体子集是否覆盖正文用字    ④ 章节正文与 manuscript/ 源稿是否一致
#   ⑤ 阅读器 38 项端到端断言（无头 Chrome 驱动真页面）

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static-checks:
    name: 静态校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: ① 全站 ?v= 版本号统一
        run: node tools/bump-assets.mjs --check

      - name: ② SW 预缓存条目与脚本引用
        run: node tools/check-precache.mjs

      - name: ③ 楷体子集覆盖正文用字
        run: python tools/make-kai-subset.py --check

      - name: ④ 章节正文与 manuscript/ 源稿一致
        run: node tools/manuscript-sync.mjs

  e2e:
    name: 端到端（真浏览器）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 镜像自带的 Chrome 会随 runner 镜像滚动，今天能跑明天可能起不来；
      # 这里额外装一份官方 stable，用 CHROME_BIN 显式指过去，让 e2e 不依赖镜像内容。
      # install-dependencies：把 Chrome 缺的系统库一起 apt 装上 —— 「浏览器起不来」
      # 最常见的原因就是新版镜像里少了 libnss3 / libatk 之类的依赖。
      # continue-on-error：装不上就退回镜像自带的那份（e2e 自己会找），不拖垮整个 job。
      - name: 安装 Chrome（失败则用镜像自带）
        id: setup-chrome
        continue-on-error: true
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: 记录浏览器版本（排障用）
        run: |
          echo "CHROME_BIN=${{ steps.setup-chrome.outputs.chrome-path }}"
          "${{ steps.setup-chrome.outputs.chrome-path || '/usr/bin/google-chrome' }}" --version || true

      - name: 阅读器端到端 38 项
        run: node tools/e2e.mjs
        env:
          CI: true
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
