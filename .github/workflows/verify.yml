name: verify

# 为什么要有 CI：pre-push 钩子只对「配过 core.hooksPath 的那个 clone」生效。
# 换一台机器（比如 Mac 上）、或者直接改线上文件，钩子一次都不会跑。
# 这里把同一套检查放到服务端，谁的机器、什么时间推的，都照样检查。
#
# 检查内容与本地钩子一一对应，外加一套真浏览器端到端测试：
#   ① 全站 ?v= 是否统一          ② SW 预缓存条目是否都存在
#   ③ 楷体子集是否覆盖正文用字    ④ 章节正文与 manuscript/ 源稿是否一致
#   ⑤ 阅读器 27 项端到端断言（无头 Chrome 驱动真页面）

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static-checks:
    name: 静态校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: ① 全站 ?v= 版本号统一
        run: node tools/bump-assets.mjs --check

      - name: ② SW 预缓存条目与脚本引用
        run: node tools/check-precache.mjs

      - name: ③ 楷体子集覆盖正文用字
        run: python tools/make-kai-subset.py --check

      - name: ④ 章节正文与 manuscript/ 源稿一致
        run: node tools/manuscript-sync.mjs

  e2e:
    name: 端到端（真浏览器）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ubuntu-latest 自带 google-chrome，tools/e2e.mjs 会自动找到它；
      # CI=true 时会补上 --no-sandbox 与 --disable-dev-shm-usage
      - name: 阅读器端到端 27 项
        run: node tools/e2e.mjs
        env:
          CI: true
