      <div class="char-detail-card">
        <div class="char-detail-top">
          <div class="char-photo char-detail-photo">
            <button type="button" class="char-photo-btn" data-lightbox-src="../assets/portrait-ningzunjiu-1024.webp" data-lightbox-name="宁樽酒" aria-label="查看宁樽酒的立绘">

            <div class="char-tags">
              <span class="char-tag">沉着</span>
              <span class="char-tag role">朋友</span>
            </div>

        <div class="char-quote char-detail-quote">“……我也可以，成为那样的人吗？”</div>
      </div>

      <div class="char-detail-section">
        <div class="char-detail-section-title">小传</div>
        <div class="char-detail-bio">
          <p>重要主角团之一。父母离婚，与哥哥相依为命。但哥哥因为车祸昏迷，一直陪在他身边照顾他。渐渐地不爱说话了。</p>
          <p>被叶南衡无声的帮助了很多次，在他身上找到了哥哥的感觉。从那以后，心里十分仰慕叶南衡。暗恋四大校花之一的黎颜——他与黎颜在小学的时候是同学，那时的他胆小，自卑，但是黎颜是一个非常有正义感的人，在他被欺负的时候，挺身而出。虽然黎颜不记得，因为那就是她会做的事，不是因为这个人是谁。但是，黎颜的身影却深深刻在了他的脑海里，挥之不去。</p>
        </div>
      </div>

      <div class="char-detail-section">
        <div class="char-detail-section-title">设定</div>
        <div class="char-tags char-detail-traits"><span class="char-tag">不善言辞</span><span class="char-tag">自卑</span></div>
      </div>
    </article>
