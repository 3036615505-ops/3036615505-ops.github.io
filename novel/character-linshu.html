    <article class="char-detail">
      <div class="char-detail-card">
        <div class="char-detail-top">
          <div class="char-photo char-detail-photo">
            <button type="button" class="char-photo-btn" data-lightbox-src="../assets/portrait-linshu-1024.webp" data-lightbox-name="林纾" aria-label="查看林纾的立绘">
              <img src="../assets/portrait-linshu-1024.webp" loading="lazy" decoding="async" alt="林纾">
            </button>

            <h1>林纾</h1>
            <div class="char-tags">
              <span class="char-tag">明亮</span>
              <span class="char-tag role">主视角</span>
            </div>
            <div class="char-detail-birth">2007年4月20日</div>
          </div>
        </div>
        <div class="char-quote char-detail-quote">“南南，请我喝焦糖玛奇朵！”</div>
      </div>

      <div class="char-detail-section">
        <div class="char-detail-section-title">小传</div>
        <div class="char-detail-bio">
          <p>与叶南衡两小无猜。两家父母相识，从小一起长大。是南城一中当之无愧的学霸，成绩格外优异。长得很漂亮，同时待人友善，不失风雅，在外人的眼中她总是面带微笑，但却“可远观而不可亵玩”。四大校花之一。</p>
          <p>爱笑，她的笑，总是叶南衡心中的那束忘不了的光。她对叶南衡的爱意藏在每一个不经意的细节里，小到可能只是下意识的，她自己都不曾注意到。她是明媚的，给叶南衡的生活里添加了不一样的色彩。</p>
        </div>
      </div>

      <div class="char-detail-section">
        <div class="char-detail-section-title">设定</div>
        <div class="char-tags char-detail-traits"><span class="char-tag">青梅竹马</span><span class="char-tag">被偏爱</span></div>
      </div>
    </article>

    <div class="home-footer">名字记住以后，故事就会自己发光</div>
