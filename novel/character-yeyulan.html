  <div class="phone-frame">

    <div class="detail-header">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

    <article class="char-detail">
      <div class="char-detail-card">
        <div class="char-detail-top">
          <div class="char-photo char-detail-photo">
            <button type="button" class="char-photo-btn" data-lightbox-src="../assets/portrait-yeyulan-1024.webp" data-lightbox-name="叶羽澜" aria-label="查看叶羽澜的立绘">

          </div>
          <div class="char-detail-id">
            <h1>叶羽澜</h1>
            <div class="char-tags">
              <span class="char-tag">通透</span>
              <span class="char-tag role">叶南衡表姐</span>
            </div>
          </div>

        <div class="char-quote char-detail-quote">“走啦，小笨蛋。”</div>
      </div>

      <div class="char-detail-section">
        <div class="char-detail-section-title">小传</div>
        <div class="char-detail-bio">
          <p>叶南衡的表姐，温柔，漂亮。目前在上大学。是世界上最懂叶南衡的人，也是最心疼叶南衡的人。曾经被小时候的乐观的叶南衡“拯救”过，所以对叶南衡十分喜欢，胜过姐弟。</p>
          <p>因为回家做手术，而留在了这里一段时间，期间见过江不秋、林纾，并告诉她们自己的感受和经历，告诉她们叶南衡是一个怎样的人。最后，潇洒地离开了家——“走啦，小笨蛋”。是小说进程重要的推进人之一。</p>
        </div>
      </div>

      <div class="char-detail-section">
        <div class="char-detail-section-title">设定</div>
        <div class="char-tags char-detail-traits"><span class="char-tag">通透</span><span class="char-tag">潇洒</span></div>
      </div>
    </article>

    <div class="home-footer">名字记住以后，故事就会自己发光</div>
