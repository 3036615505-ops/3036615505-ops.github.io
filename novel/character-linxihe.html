  <div class="phone-frame">

    <div class="detail-header">
      <a href="characters.html" class="detail-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </a>
      <span class="detail-header-title">同学录</span>
    </div>

    <article class="char-detail">
      <div class="char-detail-card">
        <div class="char-detail-top">
          <div class="char-photo char-detail-photo">
            <button type="button" class="char-photo-btn" data-lightbox-src="../assets/portrait-linxihe-1024.webp" data-lightbox-name="林晞和" aria-label="查看林晞和的立绘">
              <img src="../assets/portrait-linxihe-1024.webp" loading="lazy" decoding="async" alt="林晞和">
            </button>
          </div>
          <div class="char-detail-id">
            <h1>林晞和</h1>
            <div class="char-tags">
              <span class="char-tag">善良</span>
              <span class="char-tag role">江不秋继母</span>
            </div>
          </div>
        </div>
        <div class="char-quote char-detail-quote">“我什么都不求，你好好的就行。”</div>
      </div>

      <div class="char-detail-section">
        <div class="char-detail-section-title">小传</div>
        <div class="char-detail-bio">
          <p>江不秋的继母。江不秋口中“很好很好的人”。她跟江不秋的爸妈是同学，也一直喜欢着江枕默。但是知道他喜欢的是江不秋的母亲后，便选择了退出。</p>
          <p>在江枕默因为苏霁温的死而消沉的时候，主动地走向了他，让他再次振作起来，却从不奢求什么。在她表明了自己曾经喜欢她的心迹之后，江枕默作为一个重情重义的人，最终给了她一个家。</p>
          <p>她也是个很善良的人，对江不秋视如己出。江不秋也知道继母对她很好，只不过，在母亲死后，她的世界就容不下任何人了。</p>
        </div>
      </div>

      <div class="char-detail-section">
        <div class="char-detail-section-title">设定</div>
        <div class="char-tags char-detail-traits"><span class="char-tag">善良</span><span class="char-tag">不求回报</span></div>
      </div>
    </article>

    <div class="home-footer">名字记住以后，故事就会自己发光</div>
