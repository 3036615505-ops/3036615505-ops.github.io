<!DOCTYPE html>
<html lang="zh-CN" data-fontsize="medium" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="春华录 - 一段关于青春与成长的故事，在江南的小镇上，少年们如春花般绽放，又如春雨般悄然散落。">
  <title>春华录</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="phone-frame">
  <!-- 顶部导航 -->
  <div class="detail-header">
    <a href="../../" class="detail-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </a>
    <span class="detail-header-title">书籍详情</span>
  </div>

  <!-- 小说信息 -->
  <div class="detail-info">
    <div class="detail-cover">
      <img src="assets/cover.jpg" alt="春华录">
    </div>
    <div class="detail-meta">
      <h1>春华录</h1>
      <div class="author">佚名</div>
      <div class="tags">
        <span class="tag">言情</span>
        <span class="tag blue">青春</span>
        <span class="tag green">连载</span>
      </div>
      <div class="stats">2章 · 1335字</div>
    </div>
  </div>

  <!-- 简介 -->
  <div class="detail-desc">
    <div class="desc-text" id="descText">一段关于青春与成长的故事，在江南的小镇上，少年们如春花般绽放，又如春雨般悄然散落。</div>
    <span class="expand-btn" id="expandBtn" onclick="toggleDesc()">展开</span>
  </div>

  <!-- 操作按钮 -->
  <div class="start-reading">
    <a href="chapter-01.html" class="btn-primary">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      开始阅读
    </a>
    <a href="#" class="btn-secondary">加入书架</a>
  </div>

  <!-- 目录 -->
  <div class="chapter-section">
    <div class="chapter-section-header">
      <h2>目录</h2>
      <span>共 2 章</span>
    </div>
    <div class="chapter-list">
      
      <a href="chapter-01.html" class="chapter-item">
        <span class="chapter-num">第1章</span>
        <span class="chapter-title">第一章 初见</span>
      </a>
    

      <a href="chapter-02.html" class="chapter-item">
        <span class="chapter-num">第2章</span>
        <span class="chapter-title">第二章 同桌</span>
      </a>
    
    </div>
  </div>

  <script src="../js/reader.js"></script>
  <script>
    function toggleDesc() {
      var el = document.getElementById('descText');
      var btn = document.getElementById('expandBtn');
      el.classList.toggle('expanded');
      btn.textContent = el.classList.contains('expanded') ? '收起' : '展开';
    }
  </script>
  </div>
</body>
</html>
