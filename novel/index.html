<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f8f4ed">
  <meta name="description" content="临渊羡鱼 - 目录">
  <title>临渊羡鱼 - 目录</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/chapters.js"></script>
</head>
<body>
  <div class="phone-frame">

  <div class="detail-header">
    <a href="../" class="detail-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </a>
    <span class="detail-header-title">目录</span>
  </div>

  <div class="detail-info">
    <div class="detail-cover linyuan">
      <span class="book-cover-text">临渊羡鱼</span>
    </div>
    <div class="detail-meta">
      <h1>临渊羡鱼</h1>
      <div class="author">南城的梧桐树还在长</div>
      <div class="stats">连载中 · 2 章 · 4979 字</div>
    </div>
  </div>

  <div class="detail-desc">
    <div class="desc-text">南城的梧桐树还在长，一群人的青春悠远漫长....</div>
  </div>

  <div class="detail-links">
    <a href="characters.html" class="detail-link-card">
      <span class="detail-link-kicker">人物簿</span>
      <span class="detail-link-title">翻开他们的名字</span>
      <span class="detail-link-desc">用几句很轻的话，先认识这些会慢慢走近的人。</span>
    </a>
  </div>

  <div class="start-reading">
    <a href="chapter-01.html" class="btn-primary" id="continueBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <span id="continueBtnText">开始阅读</span>
    </a>
  </div>

  <!-- 阅读进度总览 -->
  <div class="reading-overview" id="readingOverview" style="display:none">
    <div class="overview-header">
      <span class="overview-title">阅读进度</span>
      <span class="overview-pct" id="overviewPct">0%</span>
    </div>
    <div class="overview-bar">
      <div class="overview-fill" id="overviewFill"></div>
    </div>
    <div class="overview-chapters" id="overviewChapters"></div>
  </div>

  <div class="reading-footprints mini" id="novelFootprints" style="display:none">
    <div class="footprints-header">
      <span class="footprints-title">阅读足迹</span>
      <span class="footprints-kicker" id="novelFootprintsKicker">故事刚刚有回声</span>
    </div>
    <div class="footprints-copy" id="novelFootprintsCopy"></div>
    <div class="footprints-metrics" id="novelFootprintsMetrics"></div>
  </div>

  <div class="chapter-section">
    <div class="chapter-section-header">
      <h2>目录</h2>
      <span>共 2 章</span>
    </div>
    <div class="chapter-list">
      <a href="chapter-01.html" class="chapter-item">
        <div class="chapter-topline">
          <span class="chapter-num">第1章</span>
          <span class="chapter-words">2722 字</span>
        </div>
        <div class="chapter-main">
          <span class="chapter-title">第一章·临渊羡鱼</span>
          <span class="chapter-status-slot"></span>
        </div>
        <div class="chapter-blurb">所有的事都还没开始，一切都还来得及。</div>
      </a>
      <a href="chapter-02.html" class="chapter-item">
        <div class="chapter-topline">
          <span class="chapter-num">第2章</span>
          <span class="chapter-words">2257 字</span>
        </div>
        <div class="chapter-main">
          <span class="chapter-title">第二章·前桌</span>
          <span class="chapter-status-slot"></span>
        </div>
        <div class="chapter-blurb">有些位置只是前后桌，有些位置会慢慢变得不同。</div>
      </a>
    </div>
  </div>

  </div>

  <!-- 页面切换动画 -->
  <div class="page-transition" id="pageTransition">
    <div class="transition-inner">
      <div class="transition-leaves">
        <span class="leaf gold"></span>
        <span class="leaf green"></span>
        <span class="leaf brown"></span>
        <span class="leaf gold soft"></span>
        <span class="leaf green soft"></span>
      </div>
      <svg viewBox="0 0 40 40" fill="none" width="40" height="40">
        <path class="leaf-path" d="M20 4c0 0-8 4-10 12s4 16 10 20c6-4 12-12 10-20S20 4 20 4z" stroke="var(--accent)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        <path class="leaf-vein" d="M20 8v24M20 14l-4 4M20 14l4 4M20 20l-5 3M20 20l5 3" stroke="var(--accent)" stroke-width="0.8" opacity="0.5" stroke-linecap="round"/>
      </svg>
      <div class="transition-text">梧桐叶正落下</div>
    </div>
  </div>

  <script>
  (function() {
    var transitionLines = [
      '风从走廊尽头吹过来',
      '有些话还没说，故事已经往前了',
      '夕阳落下去的时候，影子会变长',
      '下一页有人会抬头看你一眼',
      '梧桐影子轻轻翻过一页'
    ];

    function pickTransitionLine() {
      var line = transitionLines[Math.floor(Math.random() * transitionLines.length)];
      sessionStorage.setItem('page-transition-text', line);
      return line;
    }

    function getTransitionLine() {
      var saved = sessionStorage.getItem('page-transition-text');
      if (saved) {
        sessionStorage.removeItem('page-transition-text');
        return saved;
      }
      return transitionLines[Math.floor(Math.random() * transitionLines.length)];
    }

    // ===== 页面切换动画 =====
    var transition = document.getElementById('pageTransition');

    function startPageTransition(href) {
      if (!transition) {
        window.location.href = href;
        return;
      }
      transition.classList.add('active');
      transition.querySelector('.transition-text').textContent = pickTransitionLine();
      sessionStorage.setItem('page-transitioning', '1');
      setTimeout(function() { window.location.href = href; }, 120);
    }

    // 入场动画（从站内跳转过来时显示）
    if (sessionStorage.getItem('page-transitioning')) {
      sessionStorage.removeItem('page-transitioning');
      if (transition) {
        requestAnimationFrame(function() {
          transition.classList.add('active');
          var textEl = transition.querySelector('.transition-text');
          if (textEl) textEl.textContent = getTransitionLine();
          setTimeout(function() { transition.classList.remove('active'); }, 650);
        });
      }
    }

    // 安全网：清除任何残留的遮罩
    function resetOverlay() {
      document.querySelectorAll('.page-transition.active').forEach(function(el) { el.classList.remove('active'); });
    }
    window.addEventListener('pageshow', function() { setTimeout(resetOverlay, 700); });
    window.addEventListener('focus', function() { setTimeout(resetOverlay, 700); });
    document.addEventListener('visibilitychange', function() { if (!document.hidden) setTimeout(resetOverlay, 700); });

    // 点击跳转
    document.querySelectorAll('a[href]').forEach(function(link) {
      link.addEventListener('click', function(e) {
        var href = link.getAttribute('href');
        if (!href || href.startsWith('#') || href.startsWith('javascript') || link.target === '_blank' || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        e.preventDefault();
        startPageTransition(href);
      });
    });

    // ===== 章节阅读进度 =====
    var items = document.querySelectorAll('.chapter-item');
    var totalRead = 0, totalWords = 0;
    var chapterData = [];
    var lastReadChapter = null;
    var lastReadPct = 0;

    items.forEach(function(item) {
      var href = item.getAttribute('href');
      if (!href) return;
      var id = getChapterStorageId(href);
      var pct = parseInt(localStorage.getItem('reader-pos-' + id)) || 0;
      var done = localStorage.getItem('reader-done-' + id) === '1';
      var ch = CHAPTERS.find(function(c) { return c.file === href; });
      var words = ch ? ch.words : 0;
      totalWords += words;

      var titleEl = item.querySelector('.chapter-title');
      var title = titleEl ? titleEl.textContent : '';
      chapterData.push({ pct: done ? 100 : pct, title: title });

      if (done) {
        item.classList.add('done');
        var badge = document.createElement('span');
        badge.className = 'chapter-status done';
        badge.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
        var slot = item.querySelector('.chapter-status-slot');
        (slot || item).appendChild(badge);
        totalRead += words;
        lastReadChapter = href;
        lastReadPct = 100;
      } else if (pct > 0) {
        var progressWrap = document.createElement('div');
        progressWrap.className = 'chapter-progress-wrap';
        progressWrap.innerHTML = '<div class="chapter-progress-fill" style="width:' + pct + '%"></div>';
        item.appendChild(progressWrap);

        var badge = document.createElement('span');
        badge.className = 'chapter-status reading';
        badge.textContent = pct + '%';
        var slot = item.querySelector('.chapter-status-slot');
        (slot || item).appendChild(badge);

        totalRead += Math.round(words * pct / 100);
        if (!lastReadChapter || pct > lastReadPct) {
          lastReadChapter = href;
          lastReadPct = pct;
        }
      }
    });

    if (totalRead > 0) {
      var readPct = Math.round(totalRead / totalWords * 100);

      var overviewEl = document.getElementById('readingOverview');
      if (overviewEl) {
        overviewEl.style.display = 'block';
        document.getElementById('overviewPct').textContent = readPct + '%';
        document.getElementById('overviewFill').style.width = readPct + '%';

        var chaptersEl = document.getElementById('overviewChapters');
        if (chaptersEl && chapterData.length > 0) {
          var html = '<div class="overview-chapter-row">';
          chapterData.forEach(function(ch) {
            var cls = ch.pct >= 100 ? 'dot done' : (ch.pct > 0 ? 'dot reading' : 'dot');
            var style = ch.pct > 0 && ch.pct < 100 ? ' style="background:linear-gradient(90deg,var(--accent) ' + ch.pct + '%,var(--border-light) ' + ch.pct + '%)"' : '';
            html += '<div class="' + cls + '"' + style + ' title="' + ch.title + ' ' + ch.pct + '%"></div>';
          });
          html += '</div>';
          chaptersEl.innerHTML = html;
        }
      }

      var footprints = readFootprints();
      var footprintsEl = document.getElementById('novelFootprints');
      if (footprintsEl) {
        footprintsEl.style.display = 'block';
        document.getElementById('novelFootprintsKicker').textContent = getFootprintsKicker(readPct, footprints.daysCount);
        document.getElementById('novelFootprintsCopy').textContent = getFootprintsCopy(readPct, footprints.lastChapterTitle);
        document.getElementById('novelFootprintsMetrics').innerHTML = [
          renderMetric('已读', readPct + '%'),
          renderMetric('摘句', footprints.quotesCount + ' 句'),
          renderMetric('相伴', footprints.daysCount + ' 天')
        ].join('');
      }

      var statsEl = document.querySelector('.stats');
      if (statsEl) {
        statsEl.textContent = statsEl.textContent + ' · 已读 ' + readPct + '%';
      }

      var btnEl = document.querySelector('.btn-primary');
      if (btnEl && lastReadChapter) {
        btnEl.href = lastReadChapter;
        var svgEl = btnEl.querySelector('svg');
        btnEl.innerHTML = '';
        if (svgEl) btnEl.appendChild(svgEl);
        var spanEl = document.createElement('span');
        spanEl.textContent = '继续阅读';
        btnEl.appendChild(spanEl);
      }
    }

    function readFootprints() {
      var raw = localStorage.getItem('reader-footprints');
      if (!raw) return { daysCount: 0, quotesCount: 0, lastChapterTitle: '' };
      try {
        var data = JSON.parse(raw);
        return {
          daysCount: Array.isArray(data.days) ? data.days.length : 0,
          quotesCount: Array.isArray(data.quotes) ? data.quotes.length : 0,
          lastChapterTitle: data.lastChapterTitle || ''
        };
      } catch (err) {
        return { daysCount: 0, quotesCount: 0, lastChapterTitle: '' };
      }
    }

    function getFootprintsKicker(readPct, daysCount) {
      if (readPct >= 100) return '你已经把这一段路走完了';
      if (daysCount >= 3) return '这是一起把页角翻过去的第 ' + daysCount + ' 天';
      if (readPct >= 50) return '故事已经慢慢有了回声';
      return '故事刚刚有回声';
    }

    function getFootprintsCopy(readPct, lastChapterTitle) {
      if (lastChapterTitle) {
        return '上一次停在《' + lastChapterTitle + '》，风还留在那一页。';
      }
      if (readPct > 0) {
        return '你已经陪他们走过一段午后。';
      }
      return '等你翻开第一页，梧桐影子就会慢慢落下来。';
    }

    function renderMetric(label, value) {
      return '<div class="footprint-pill"><span>' + label + '</span><strong>' + value + '</strong></div>';
    }
  })();
  </script>
</body>
</html>
