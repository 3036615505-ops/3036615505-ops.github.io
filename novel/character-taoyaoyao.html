<body class="tab-page-body">
  <div class="phone-frame">

    <div class="detail-header">
      <a href="characters.html" class="detail-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </a>
      <span class="detail-header-title">同学录</span>
    </div>

    <article class="char-detail">
      <div class="char-detail-card">
        <div class="char-detail-top">
          <div class="char-photo char-detail-photo">
            <button type="button" class="char-photo-btn" data-lightbox-src="../assets/portrait-taoyaoyao-1024.webp" data-lightbox-name="桃夭夭" aria-label="查看桃夭夭的立绘">
              <img src="../assets/portrait-taoyaoyao-1024.webp" loading="lazy" decoding="async" alt="桃夭夭">
            </button>
          </div>
          <div class="char-detail-id">
            <h1>桃夭夭</h1>
            <div class="char-tags">
              <span class="char-tag">克制</span>
              <span class="char-tag role">数学老师</span>
            </div>
          </div>
        </div>
        <div class="char-quote char-detail-quote">“肖灼，你为什么一直躲着我？”</div>
      </div>

      <div class="char-detail-section">
        <div class="char-detail-section-title">小传</div>
        <div class="char-detail-bio">
          <p>学校的数学老师，很漂亮，身世显赫，被肖灼叫做“大小姐”。是同学们眼中的灭绝师太，暗恋了肖灼许久，但肖灼迟迟不肯表白，自己也耷拉不下脸面。</p>
          <p>尤其喜欢叶南衡和江不秋。喜欢叶南衡，是因为叶南衡总给人一种乐观开朗的感觉，是个“小宝藏”；看到了江不秋的不合群，想到了曾经的自己，给予了她很多帮助。也推进了叶南衡和江不秋之间的交流。</p>
        </div>
      </div>

      <div class="char-detail-section">
        <div class="char-detail-section-title">设定</div>
        <div class="char-tags char-detail-traits"><span class="char-tag">外冷内热</span></div>
      </div>
    </article>

    <div class="home-footer">名字记住以后，故事就会自己发光</div>

  </div>
