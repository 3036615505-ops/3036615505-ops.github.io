        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

    <article class="char-detail">
      <div class="char-detail-card">
        <div class="char-detail-top">
          <div class="char-photo char-detail-photo">
            <button type="button" class="char-photo-btn" data-lightbox-src="../assets/portrait-jiangzhenmo-1024.webp" data-lightbox-name="江枕默" aria-label="查看江枕默的立绘">

            <h1>江枕默</h1>
            <div class="char-tags">
              <span class="char-tag">沉默</span>
              <span class="char-tag role">江不秋父亲</span>
            </div>
          </div>
        </div>
        <div class="char-quote char-detail-quote">“有些话，说了怕她难过，不说，怕她不懂。”</div>
      </div>

      <div class="char-detail-section">
        <div class="char-detail-section-title">小传</div>
        <div class="char-detail-bio">
          <p>江不秋的父亲。“枕”是沉默的陪伴；“默”是少言寡语，爱在心口难开的性格。江不秋的清冷与沉默又何尝不是一面映出父亲最深的性格底色的镜子。</p>
          <p>他很爱自己的妻子和女儿，但却有自己难言的苦衷。他始终在女儿看不见的地方，默默枕着思念与愧疚。</p>
        </div>
      </div>

      <div class="char-detail-section">
        <div class="char-detail-section-title">设定</div>
        <div class="char-tags char-detail-traits"><span class="char-tag">重情重义</span><span class="char-tag">少言寡语</span></div>
      </div>
    </article>

    <div class="home-footer">名字记住以后，故事就会自己发光</div>
