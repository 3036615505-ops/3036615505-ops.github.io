<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f4ed">
  <meta name="description" content="南城的梧桐树还在长">
  <link rel="icon" href="favicon.png" type="image/png">
  <title>临渊羡鱼</title>
  <meta property="og:title" content="临渊羡鱼">
  <meta property="og:description" content="南城的梧桐树还在长——青春 · 校园 · 成长">
  <meta property="og:image" content="https://zephyrw.site/assets/og-cover.jpg">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="manifest" href="manifest.json">
  <!-- 样式表必须排在最前面：它是唯一阻塞首次渲染的资源。
       缩略图 preload 放到样式表之后，否则这个 high 优先级请求会排在 CSS 前面、
       抢走同一条连接上的带宽（实测冷启动：cover 199ms 起、CSS 201ms 起）。
       这里改指 144x196 的 cover-thumb.webp（5.7KB），
       不再用 528x720 的 cover.webp（69.4KB）去画一个 46x62 的方块。 -->
  <link rel="stylesheet" href="css/style.css?v=35">
  <link rel="preload" as="image" href="assets/cover-thumb.webp">
  <script src="js/theme.js?v=35"></script>
</head>
<body class="tab-page-body">
  <div class="phone-frame home-page">

    <header class="home-header">
      <div>
        <h1 class="home-title">临渊羡鱼</h1>
        <div class="home-subtitle">南城的梧桐树还在长</div>
      </div>
      <div class="leaf-pill">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C7 8 4 13 12 22c8-9 5-14 0-20z"/></svg>
        <span id="leafPillText">未萌</span>
      </div>
    </header>

    <!-- 六级阶段图只给 data-src：真正的 src 由下面内联脚本按当前阅读进度
         只写 1~2 张（相邻两级做淡入淡出），不是六张全下载。
         decoding="async" 让解码离开首帧合成，避免首屏多占一次同步解码。 -->
    <section class="tree-band" id="treeBand">
      <div class="tree-sway">
        <img class="tree-stage" data-src="assets/tree-bare.webp" alt="" decoding="async">
        <img class="tree-stage" data-src="assets/tree-s1.webp" alt="" decoding="async">
        <img class="tree-stage" data-src="assets/tree-s2.webp" alt="" decoding="async">
        <img class="tree-stage" data-src="assets/tree-s3.webp" alt="" decoding="async">
        <img class="tree-stage" data-src="assets/tree-s4.webp" alt="" decoding="async">
        <img class="tree-stage" data-src="assets/tree-s5.webp" alt="" decoding="async">
      </div>
      <div class="tree-caption">
        <div class="tree-caption-main" id="treeCaption">梧桐还在沉睡</div>
        <div class="tree-caption-sub">读到哪里，树就长到哪里</div>
      </div>
    </section>

    <section class="home-reading-card" id="homeReadingCard">
      <div class="rc-row">
        <div class="rc-cover" id="rcCover"></div>
        <div class="rc-info">
          <div class="rc-chapter" id="rcChapter">第一章 · 临渊羡鱼</div>
          <div class="rc-meta" id="rcMeta">还未开始 · 2722 字</div>
          <div class="rc-bar"><div class="rc-fill" id="rcFill" style="width:0%"></div></div>
        </div>
        <a href="novel/chapter-01.html" class="rc-btn" id="rcBtn">开始阅读</a>
      </div>
    </section>

    <section class="home-quote" id="homeQuote">
      <button class="quote-pause-btn" id="quotePauseBtn" aria-label="暂停轮播" title="暂停">
        <svg class="pause-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
        <svg class="play-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </button>
      <div class="quote-inner" id="quoteInner"></div>
    </section>

    <section class="date-list-section">
      <div class="date-list-header">
        <span class="date-list-title">光阴 · 学期册</span>
        <span class="date-list-total" id="dateListTotal">0 字</span>
      </div>
      <div class="date-list" id="dateList"></div>
    </section>

    <footer class="home-footer">南城的梧桐树还在长</footer>

    <!-- 版本号与手动检查更新：刻意做得很轻（11px、--text-muted），不抢主视觉。
         版本号由 App 壳的 LinyuanApp.getAppVersion() 提供；浏览器里不显示。 -->
    <div class="app-update-row">
      <span class="app-version" id="appVersion"></span>
      <span class="app-update-sep" id="appVersionSep">·</span>
      <button type="button" class="app-update-link" id="checkUpdateBtn">检查更新</button>
    </div>

  </div>

  <nav class="tab-bar">
    <a class="tab-item active" href="index.html">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      <span>首页</span>
    </a>
    <a class="tab-item" href="novel/index.html">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4.5" width="5" height="15" rx="1"/><rect x="10" y="4.5" width="5" height="15" rx="1"/><path d="M16.6 5.7l3.5 1-3 13.4-3.5-1z"/></svg>
      <span>书架</span>
    </a>
    <a class="tab-item" href="novel/characters.html">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      <span>人物</span>
    </a>
    <a class="tab-item" href="quotes.html">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 7H5a1 1 0 00-1 1v4a1 1 0 001 1h3v4l4-4V8a1 1 0 00-1-1H8z"/><path d="M19 7h-3a1 1 0 00-1 1v4a1 1 0 001 1h3v4l4-4V8a1 1 0 00-1-1h-3z" transform="translate(-3 0)"/></svg>
      <span>剪贴本</span>
    </a>
  </nav>

  <!-- 章节数据放 body 末尾，不放 head：head 里的同步脚本会阻塞 HTML 解析，
       弱网下 chapters.js 没回来之前整页白屏（首屏可感知卡顿）。
       放在这里首屏骨架先画出来；但必须保持在下面依赖 CHAPTERS 的内联脚本之前
       （经典脚本按文档顺序执行，内联脚本是同步 IIFE，等不到任何异步回调）。 -->
  <script src="js/chapters.js?v=35"></script>
  <script src="js/transition.js?v=35"></script>

  <script>
  (function() {

    // ===== 梧桐进度带：阶段图连续过渡 =====
    // 六级阶段图（0/20/40/60/80/100%）全部由 AI 绘制、同构图；
    // 相邻两级之间按进度比例淡入淡出，任何进度都呈现自然的中间形态。
    (function() {
      var stages = document.querySelectorAll('.tree-stage');
      var pill = document.getElementById('leafPillText');
      var caption = document.getElementById('treeCaption');

      var totalWords = 0, readWords = 0;
      CHAPTERS.forEach(function(ch) {
        totalWords += ch.words;
        var key = getChapterStorageId(ch.file);
        var pct = parseInt(localStorage.getItem('reader-pos-' + key)) || 0;
        var done = localStorage.getItem('reader-done-' + key) === '1';
        if (done) readWords += ch.words;
        else if (pct > 0) readWords += Math.round(ch.words * pct / 100);
      });
      var pct = totalWords > 0 ? Math.min(100, Math.round(readWords / totalWords * 100)) : 0;

      var STAGES = [
        { min: 0,   name: '未萌', caption: '梧桐还在沉睡' },
        { min: 1,   name: '新芽', caption: '枝头冒出第一点绿' },
        { min: 16,  name: '抽枝', caption: '叶子一片片醒过来' },
        { min: 46,  name: '繁叶', caption: '树阴渐渐连成了片' },
        { min: 81,  name: '亭亭', caption: '就快长成一片荫了' },
        { min: 100, name: '如盖', caption: '亭亭如盖，一如那个九月' }
      ];
      var stage = STAGES[0];
      for (var i = 0; i < STAGES.length; i++) {
        if (pct >= STAGES[i].min) stage = STAGES[i];
      }
      if (pill) pill.textContent = stage.name;
      if (caption) caption.textContent = stage.caption;

      if (!stages.length) return;
      var rung = 100 / (stages.length - 1);
      // 按需加载：只请求当前进度用到的两级（相邻级做淡入淡出），其余不下载
      var lo = Math.floor(pct / rung + 1e-6);
      var hi = Math.ceil(pct / rung - 1e-6);
      stages.forEach(function(img, i) {
        if ((i === lo || i === hi) && !img.getAttribute('src')) {
          img.src = img.getAttribute('data-src');
        }
        var d = Math.abs(pct - i * rung) / rung;
        img.style.opacity = d >= 1 ? 0 : (1 - d).toFixed(3);
      });
    })();

    // ===== 继续阅读卡（新读者显示第一章） =====
    (function() {
      var lastReadChapter = null, lastReadPct = 0;
      CHAPTERS.forEach(function(ch) {
        var key = getChapterStorageId(ch.file);
        var pct = parseInt(localStorage.getItem('reader-pos-' + key)) || 0;
        var done = localStorage.getItem('reader-done-' + key) === '1';
        if (done) { lastReadChapter = ch; }
        else if (pct > 0) { lastReadChapter = ch; lastReadPct = pct; }
      });

      var cover = document.getElementById('rcCover');
      var nameEl = document.getElementById('rcChapter');
      var metaEl = document.getElementById('rcMeta');
      var fillEl = document.getElementById('rcFill');
      var btn = document.getElementById('rcBtn');
      // 缩略图：显示盒只有 46x62 CSS px（DPR 2.75 时 127x171 设备像素），
      // 用 144x196 的 cover-thumb.webp 就够；528x720 的 cover.webp 只留给书架大封面。
      if (cover) cover.style.backgroundImage = "url('assets/cover-thumb.webp')";

      if (lastReadChapter) {
        var pct = lastReadPct || 100;
        if (nameEl) nameEl.textContent = lastReadChapter.title;
        if (metaEl) metaEl.textContent = '已读 ' + pct + '% · ' + lastReadChapter.words + ' 字';
        if (fillEl) fillEl.style.width = pct + '%';
        if (btn) { btn.href = 'novel/' + lastReadChapter.file; btn.textContent = '继续阅读'; }
      }
    })();

    // ===== 光阴目录 =====
    (function() {
      var list = document.getElementById('dateList');
      var totalEl = document.getElementById('dateListTotal');
      if (!list) return;
      var totalWords = CHAPTERS.reduce(function(s, c) { return s + c.words; }, 0);
      if (totalEl) totalEl.textContent = totalWords + ' 字';

      var seen = parseInt(localStorage.getItem('reader-seen-chapters') || '0', 10);
      var hasNew = CHAPTERS.length > seen;
      localStorage.setItem('reader-seen-chapters', String(CHAPTERS.length));

      var html = '';
      CHAPTERS.forEach(function(ch) {
        var key = getChapterStorageId(ch.file);
        var done = localStorage.getItem('reader-done-' + key) === '1';
        var pct = parseInt(localStorage.getItem('reader-pos-' + key)) || 0;
        var icon = done
          ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="#8A9E6C"><path d="M12 2C7 8 4 13 12 22c8-9 5-14 0-20z"/></svg>'
          : pct > 0
            ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="#C4A24E"><path d="M12 2C7 8 4 13 12 22c8-9 5-14 0-20z"/></svg>'
            : '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#CFC2A4" stroke-width="2.2"><path d="M12 2C7 8 4 13 12 22c8-9 5-14 0-20z"/></svg>';
        var state = done
          ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#7A9068" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
          : pct > 0 ? '<span style="font-size:11px;color:#C4A24E;">' + pct + '%</span>' : '';
        var isLast = ch === CHAPTERS[CHAPTERS.length - 1];
        var badge = (hasNew && isLast) ? '<span class="date-item-new">新</span>' : '';
        html += '<a href="novel/' + ch.file + '" class="date-item">' +
          '<span class="date-item-leaf">' + icon + '</span>' +
          '<span class="date-item-date">' + (ch.date || '') + '</span>' +
          '<span class="date-item-title">' + ch.title + '</span>' +
          badge + state +
          '<span class="date-item-words">' + ch.words + '字</span>' +
        '</a>';
      });
      list.innerHTML = html;
    })();

    // ===== 金句轮播 =====
    var quotes = [
      { source: '第一章·临渊羡鱼', paragraphs: ['梧桐树又落了几片叶子，', '落在他们刚过的路上。', '蝉在远处拉长了声调叫，', '好像夏天还没走，好像暑假还没结束。', '但那一天其实已经是秋天了。'] },
      { source: '第一章·临渊羡鱼', paragraphs: ['尾音拖出去很长，', '长过了这个九月。'] },
      { source: '第一章·临渊羡鱼', paragraphs: ['那是高一开学的第一天。', '临渊羡鱼还没成为他们的老地方，', '院子里的梧桐树还没长过二楼的窗。', '所有的事都还没开始，一切都还来得及。'] },
      { source: '第二章·前桌', paragraphs: ['忽然觉得，', '来上学这件事好像也没那么讨厌了。'] }
    ];

    var quoteOuter = document.getElementById('homeQuote');
    var quoteInner = document.getElementById('quoteInner');
    var currentIdx = Math.floor(Math.random() * quotes.length);

    function renderQuote(idx) {
      var q = quotes[idx];
      if (!q) return '';
      var html = '<blockquote>';
      q.paragraphs.forEach(function(p) { html += '<p>' + p + '</p>'; });
      html += '</blockquote>';
      html += '<div class="quote-source">—— ' + q.source + '</div>';
      return html;
    }

    if (quoteOuter && quoteInner && quotes.length > 0) {
      quoteInner.innerHTML = renderQuote(currentIdx);
      var quoteTimer = null;
      var quotePaused = false;

      function tickQuote() {
        quoteInner.style.opacity = '0';
        quoteInner.style.transform = 'translateY(-6px)';
        setTimeout(function() {
          var next;
          do { next = Math.floor(Math.random() * quotes.length); } while (next === currentIdx && quotes.length > 1);
          currentIdx = next;
          quoteInner.innerHTML = renderQuote(currentIdx);
          quoteInner.style.transform = 'translateY(6px)';
          // 原来这里读一次 offsetHeight 强制同步布局（把整篇文档重排一遍，
          // 每 5 秒一次）。改成双 rAF：第一帧提交上面的样式，下一帧再上淡入，
          // 视觉效果完全一致，但不再触发强制同步布局。
          requestAnimationFrame(function() {
            requestAnimationFrame(function() {
              quoteInner.style.opacity = '1';
              quoteInner.style.transform = 'translateY(0)';
            });
          });
        }, 550);
      }

      function startQuoteTimer() { stopQuoteTimer(); quoteTimer = setInterval(tickQuote, 5000); }
      function stopQuoteTimer() { if (quoteTimer) { clearInterval(quoteTimer); quoteTimer = null; } }

      if (quotes.length > 1) {
        startQuoteTimer();
        var pauseBtn = document.getElementById('quotePauseBtn');
        if (pauseBtn) {
          pauseBtn.addEventListener('click', function() {
            quotePaused = !quotePaused;
            if (quotePaused) { stopQuoteTimer(); pauseBtn.classList.add('paused'); }
            else { startQuoteTimer(); pauseBtn.classList.remove('paused'); }
          });
        }
      }
    }

    // ===== 页面切换动画 =====
    // 实现在 js/transition.js（全站唯一一份）。这里只传本页的差异参数：
    //   skipSelector —— tab 栏内链接不参与过渡（同层级切换，遮罩会被感知成「卡住」）
    //   leaves: 0    —— 首页的遮罩是素色纱 + 一行文案，不带环绕叶与图标（保持原视觉）
    //   delegate:false —— 与抽取前一致：只给 init 执行时已存在的链接挂监听
    PageTransition.init({
      skipSelector: '.tab-bar',
      leaves: 0,
      initialText: '梧桐叶正落下'
    });

    // ===== 版本号与「检查更新」（仅 App 壳内真正可用）=====
    // 版本号来自原生桥 getAppVersion()；没有桥（浏览器打开）就不显示版本号，
    // 只保留一个可点的「检查更新」并给出「请在 App 内使用」的提示。
    (function () {
      var versionEl = document.getElementById('appVersion');
      var sepEl = document.getElementById('appVersionSep');
      var btn = document.getElementById('checkUpdateBtn');
      if (!btn) return;

      var bridge = window.LinyuanApp;
      if (versionEl) {
        var version = '';
        try {
          if (bridge && typeof bridge.getAppVersion === 'function') {
            version = String(bridge.getAppVersion() || '').trim();
          }
        } catch (err) {
          version = '';
        }
        if (version) {
          versionEl.textContent = 'v' + version;
        } else {
          // 浏览器或老版本壳：不显示版本号，也不显示分隔点
          versionEl.style.display = 'none';
          if (sepEl) sepEl.style.display = 'none';
        }
      }

      var originalText = btn.textContent;
      var resetTimer = null;
      function flashHint(text) {
        btn.textContent = text;
        btn.disabled = true;
        if (resetTimer) clearTimeout(resetTimer);
        resetTimer = setTimeout(function () {
          btn.textContent = originalText;
          btn.disabled = false;
        }, 2200);
      }

      btn.addEventListener('click', function () {
        var app = window.LinyuanApp;
        if (app && typeof app.checkUpdate === 'function') {
          try {
            app.checkUpdate();
            return;
          } catch (err) {
            // 桥存在但调用失败（壳版本过老）：落到提示分支
          }
        }
        flashHint('请在 App 内使用此功能');
      });
    })();
  })();
  </script>
</body>
</html>
