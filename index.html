       这里改指 144x196 的 cover-thumb.webp（5.7KB），
       不再用 528x720 的 cover.webp（69.4KB）去画一个 46x62 的方块。 -->

  <!-- 章节数据放 body 末尾，不放 head：head 里的同步脚本会阻塞 HTML 解析，
       弱网下 chapters.js 没回来之前整页白屏（首屏可感知卡顿）。
       放在这里首屏骨架先画出来；但必须保持在下面依赖 CHAPTERS 的内联脚本之前
       （经典脚本按文档顺序执行，内联脚本是同步 IIFE，等不到任何异步回调）。 -->
  <script src="js/chapters.js?v=57"></script>
  <script src="js/transition.js?v=57"></script>

  <script>
  (function() {

    // ===== 梧桐进度带：阶段图连续过渡 =====
    // 六级阶段图（0/20/40/60/80/100%）全部由 AI 绘制、同构图；
    // 相邻两级之间按进度比例淡入淡出，任何进度都呈现自然的中间形态。
    (function() {
      var stages = document.querySelectorAll('.tree-stage');
      var pill = document.getElementById('leafPillText');
      var caption = document.getElementById('treeCaption');

      var totalWords = 0, readWords = 0;
      CHAPTERS.forEach(function(ch) {
        totalWords += ch.words;
        var key = getChapterStorageId(ch.file);
        var pct = parseInt(localStorage.getItem('reader-pos-' + key)) || 0;
        var done = localStorage.getItem('reader-done-' + key) === '1';
        if (done) readWords += ch.words;
        else if (pct > 0) readWords += Math.round(ch.words * pct / 100);
      });
      var pct = totalWords > 0 ? Math.min(100, Math.round(readWords / totalWords * 100)) : 0;

      var STAGES = [
        { min: 0,   name: '未萌', caption: '梧桐还在沉睡' },
        { min: 1,   name: '新芽', caption: '枝头冒出第一点绿' },
        { min: 16,  name: '抽枝', caption: '叶子一片片醒过来' },
        { min: 46,  name: '繁叶', caption: '树阴渐渐连成了片' },
        { min: 81,  name: '亭亭', caption: '就快长成一片荫了' },
        { min: 100, name: '如盖', caption: '亭亭如盖，一如那个九月' }
      ];
      var stage = STAGES[0];
      for (var i = 0; i < STAGES.length; i++) {
        if (pct >= STAGES[i].min) stage = STAGES[i];
      }
      if (pill) pill.textContent = stage.name;
      if (caption) caption.textContent = stage.caption;

      if (!stages.length) return;
      var rung = 100 / (stages.length - 1);
      // 按需加载：只请求当前进度用到的两级（相邻级做淡入淡出），其余不下载
      var lo = Math.floor(pct / rung + 1e-6);
      var hi = Math.ceil(pct / rung - 1e-6);
      stages.forEach(function(img, i) {
        if ((i === lo || i === hi) && !img.getAttribute('src')) {
          img.src = img.getAttribute('data-src');
        }
        var d = Math.abs(pct - i * rung) / rung;
        img.style.opacity = d >= 1 ? 0 : (1 - d).toFixed(3);
      });
    })();

    // ===== 继续阅读卡（新读者显示第一章） =====
    (function() {
      var lastReadChapter = null, lastReadPct = 0;
      CHAPTERS.forEach(function(ch) {
        var key = getChapterStorageId(ch.file);
        var pct = parseInt(localStorage.getItem('reader-pos-' + key)) || 0;
        var done = localStorage.getItem('reader-done-' + key) === '1';
        if (done) { lastReadChapter = ch; }
        else if (pct > 0) { lastReadChapter = ch; lastReadPct = pct; }
      });

      var cover = document.getElementById('rcCover');
      var nameEl = document.getElementById('rcChapter');
      var metaEl = document.getElementById('rcMeta');
      var fillEl = document.getElementById('rcFill');
      var btn = document.getElementById('rcBtn');
      // 缩略图：显示盒只有 46x62 CSS px（DPR 2.75 时 127x171 设备像素），
      // 用 144x196 的 cover-thumb.webp 就够；528x720 的 cover.webp 只留给书架大封面。
      if (cover) cover.style.backgroundImage = "url('assets/cover-thumb.webp')";

      if (lastReadChapter) {
        var pct = lastReadPct || 100;
        if (nameEl) nameEl.textContent = lastReadChapter.title;
        if (metaEl) metaEl.textContent = '已读 ' + pct + '% · ' + lastReadChapter.words + ' 字';
        if (fillEl) fillEl.style.width = pct + '%';
        if (btn) { btn.href = 'novel/' + lastReadChapter.file; btn.textContent = '继续阅读'; }
      }
    })();

    // ===== 光阴目录 =====
    (function() {
      var list = document.getElementById('dateList');
      var totalEl = document.getElementById('dateListTotal');
      if (!list) return;
      var totalWords = CHAPTERS.reduce(function(s, c) { return s + c.words; }, 0);
      if (totalEl) totalEl.textContent = totalWords + ' 字';

      var seen = parseInt(localStorage.getItem('reader-seen-chapters') || '0', 10);
      var hasNew = CHAPTERS.length > seen;
      localStorage.setItem('reader-seen-chapters', String(CHAPTERS.length));

      var html = '';

      // ===== 学年学期分隔 =====
      // 日期跨年就会重名（明年还有「九月二十七」），所以按「学年 + 学期」分段，
      // 标签形如「二〇二二 · 高一上」。年级不写死、也不按章数推，全由 date 的月份算：
      //   9 月–次年 1 月 = 上学期，2–8 月 = 下学期；
      //   学年 = 月份 ≥ 9 取当年，否则取上一年；年级 = 学年 − COHORT_YEAR。
      // 于是新章节只要填对 year/date，写到高二、高三时后面的分隔条会自己长出来。
      var CN_DIGIT = { '〇': 0, '零': 0, '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9, '十': 10 };
      var GRADE_NAMES = ['高一', '高二', '高三'];

      function cnNumber(s) {
        if (/^\d+$/.test(s)) return parseInt(s, 10);
        if (s === '十') return 10;
        if (s.length === 1) return CN_DIGIT.hasOwnProperty(s) ? CN_DIGIT[s] : 0;
        if (s.charAt(0) === '十') return 10 + (CN_DIGIT[s.charAt(1)] || 0);                                  // 十一、十二
        if (s.charAt(1) === '十') return (CN_DIGIT[s.charAt(0)] || 0) * 10 + (CN_DIGIT[s.charAt(2)] || 0);  // 二十
        return 0;
      }

      function cnYear(y) {
        return String(y).replace(/\d/g, function (d) { return '〇一二三四五六七八九'.charAt(Number(d)); });
      }

      function monthOf(dateStr) {
        var m = /^([〇零一二三四五六七八九十\d]{1,2})月/.exec(String(dateStr || ''));
        var v = m ? cnNumber(m[1]) : 0;
        return v >= 1 && v <= 12 ? v : 0;
      }

      // 一章里可能有多个日期（第一章从九月一日写到九月二十七）。
      // dates 写两个以上就显示成区间「九月一日–二十七」，同月时省略重复的「月」；
      // 只写一个或不写 dates 时退回 date，行为与以前一致。
      function dateSpanOf(ch) {
        var list = (ch.dates && ch.dates.length ? ch.dates : [ch.date]).filter(function (d) { return d; });
        if (!list.length) return '';
        if (list.length === 1) return list[0];
        var from = list[0];
        var to = list[list.length - 1];
        var a1 = /^(.+?月)(.*)$/.exec(from);
        var a2 = /^(.+?月)(.*)$/.exec(to);
        if (a1 && a2 && a1[1] === a2[1]) to = a2[2];
        return from + '–' + to;
      }

      // 日期列的内容：
      //   单日 → 直接显示；
      //   多日 → 包一层 .date-rotator，交给下面的定时器每 4 秒「跳」一次；
      //   系统开了「减少动效」→ 退回区间写法（九月一日–十七），信息不丢。
      var REDUCE_MOTION = !!(typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

      function dateCellHtml(ch) {
        var list = (ch.dates && ch.dates.length ? ch.dates : [ch.date]).filter(function (d) { return d; });
        if (!list.length) return '';
        if (list.length === 1 || REDUCE_MOTION) return dateSpanOf(ch);
        return '<span class="date-rotator" data-dates="' + list.join('|') + '" data-i="0">' +
          '<span class="date-rotator-text">' + list[0] + '</span></span>';
      }

      // 只有退回区间写法时才要把日期列放宽到 96px（见 .date-item-date.is-range）。
      function dateIsRange(ch) {
        var list = (ch.dates && ch.dates.length ? ch.dates : [ch.date]).filter(function (d) { return d; });
        return list.length > 1 && REDUCE_MOTION;
      }

      // 返回 { key, label }：key 相同就归为同一段（跨元旦也归在一起），
      // label 里的年份取该段第一章的年份。
      // 高中以外（推算年级越界）或日期缺失时，退回只按年份分段。
      function termGroupOf(ch) {
        if (!ch.year) return null;
        if (ch.term) return { key: 't' + ch.year + ch.term, label: cnYear(ch.year) + ' · ' + ch.term };
        var m = monthOf(ch.dates && ch.dates.length ? ch.dates[0] : ch.date);   // 学期按首日判
        if (!m) return { key: 'y' + ch.year, label: cnYear(ch.year) };
        var academicYear = m >= 9 ? ch.year : ch.year - 1;
        var grade = academicYear - (typeof COHORT_YEAR === 'number' ? COHORT_YEAR : 2022);
        if (grade < 0 || grade > 2) return { key: 'y' + ch.year, label: cnYear(ch.year) };
        var term = GRADE_NAMES[grade] + (m >= 2 && m <= 8 ? '下' : '上');
        return { key: 't' + grade + term, label: cnYear(ch.year) + ' · ' + term };
      }

      var prevGroup = null;
      CHAPTERS.forEach(function(ch) {
        var group = termGroupOf(ch);
        if (group && group.key !== prevGroup) {
          prevGroup = group.key;
          html += '<div class="date-year"><span class="date-year-label">' + group.label + '</span></div>';
        }
        var key = getChapterStorageId(ch.file);
        var done = localStorage.getItem('reader-done-' + key) === '1';
        var pct = parseInt(localStorage.getItem('reader-pos-' + key)) || 0;
        var icon = done
          ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="#8A9E6C"><path d="M12 2C7 8 4 13 12 22c8-9 5-14 0-20z"/></svg>'
          : pct > 0
            ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="#C4A24E"><path d="M12 2C7 8 4 13 12 22c8-9 5-14 0-20z"/></svg>'
            : '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#CFC2A4" stroke-width="2.2"><path d="M12 2C7 8 4 13 12 22c8-9 5-14 0-20z"/></svg>';
        var state = done
          ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#7A9068" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
          : pct > 0 ? '<span style="font-size:11px;color:#C4A24E;">' + pct + '%</span>' : '';
        var isLast = ch === CHAPTERS[CHAPTERS.length - 1];
        var badge = (hasNew && isLast) ? '<span class="date-item-new">新</span>' : '';
        html += '<a href="novel/' + ch.file + '" class="date-item">' +
          '<span class="date-item-leaf">' + icon + '</span>' +
          '<span class="date-item-date' + (dateIsRange(ch) ? ' is-range' : '') + '">' + dateCellHtml(ch) + '</span>' +
          '<span class="date-item-title">' + ch.title + '</span>' +
          badge + state +
          '<span class="date-item-words">' + ch.words + '字</span>' +
        '</a>';
      });
      list.innerHTML = html;

      // 多日期轮播：每 4 秒切下一个日期，切的时候先淡出上移、换字、再从下方淡入。
      // 只动 opacity/transform；prefers-reduced-motion 下不启动（返回区间写法）。
      var rotators = (list.querySelectorAll && !REDUCE_MOTION)
        ? list.querySelectorAll('.date-rotator') : [];
      var raf = (typeof window !== 'undefined' && window.requestAnimationFrame) || function (fn) { return setTimeout(fn, 16); };
      if (rotators.length) {
        setInterval(function () {
          Array.prototype.forEach.call(rotators, function (el) {
            var items = String(el.getAttribute('data-dates') || '').split('|');
            if (items.length < 2) return;
            var i = (Number(el.getAttribute('data-i')) + 1) % items.length;
            el.setAttribute('data-i', String(i));
            var text = el.querySelector('.date-rotator-text');
            if (!text) return;
            text.style.opacity = '0';
            text.style.transform = 'translateY(-5px)';
            setTimeout(function () {
              text.textContent = items[i];
              text.style.transform = 'translateY(5px)';
              raf(function () {
                raf(function () {
                  text.style.opacity = '1';
                  text.style.transform = 'translateY(0)';
                });
              });
            }, 260);
          });
        }, 4000);
      }
    })();

    // ===== 金句轮播 =====
    var quotes = [
      { source: '第一章·临渊羡鱼', paragraphs: ['梧桐树又落了几片叶子，', '落在他们刚过的路上。', '蝉在远处拉长了声调叫，', '好像夏天还没走，好像暑假还没结束。', '但那一天其实已经是秋天了。'] },
      { source: '第一章·临渊羡鱼', paragraphs: ['尾音拖出去很长，', '长过了这个九月。'] },
      { source: '第一章·临渊羡鱼', paragraphs: ['那是高一开学的第一天。', '临渊羡鱼还没成为他们的老地方，', '院子里的梧桐树还没长过二楼的窗。', '所有的事都还没开始，一切都还来得及。'] },
      { source: '第二章·前桌', paragraphs: ['忽然觉得，', '来上学这件事好像也没那么讨厌了。'] },
      { source: '第三章·课上', paragraphs: ['无他，', '惟天赋尔。'] }
    ];

    var quoteOuter = document.getElementById('homeQuote');
    var quoteInner = document.getElementById('quoteInner');
    var currentIdx = Math.floor(Math.random() * quotes.length);

    function renderQuote(idx) {
      var q = quotes[idx];
      if (!q) return '';
      var html = '<blockquote>';
      q.paragraphs.forEach(function(p) { html += '<p>' + p + '</p>'; });
      html += '</blockquote>';
      html += '<div class="quote-source">—— ' + q.source + '</div>';
      return html;
    }

    if (quoteOuter && quoteInner && quotes.length > 0) {
      // 先量出最高的一条，把容器高度定死，轮播时卡片不再忽高忽低（短句在框内居中）。
      // 只在这里同步布局 5 次、一次性的；不同机型每行字数不同，写死 px 会在某个
      // 宽度上差一档，所以只能量。渲染中间态不会上屏（同一个任务里连续完成）。
      var tallestQuote = 0;
      for (var qi = 0; qi < quotes.length; qi++) {
        quoteInner.innerHTML = renderQuote(qi);
        if (quoteInner.offsetHeight > tallestQuote) tallestQuote = quoteInner.offsetHeight;
      }
      // offsetHeight 为 0（页面还没排版/被隐藏）时不写，宁可变高也别把高度锁成 0
      if (tallestQuote > 0) quoteInner.style.minHeight = tallestQuote + 'px';
      quoteInner.innerHTML = renderQuote(currentIdx);
      var quoteTimer = null;
      var quotePaused = false;

      function tickQuote() {
        quoteInner.style.opacity = '0';
        quoteInner.style.transform = 'translateY(-6px)';
        setTimeout(function() {
          var next;
          do { next = Math.floor(Math.random() * quotes.length); } while (next === currentIdx && quotes.length > 1);
          currentIdx = next;
          quoteInner.innerHTML = renderQuote(currentIdx);
          quoteInner.style.transform = 'translateY(6px)';
          // 原来这里读一次 offsetHeight 强制同步布局（把整篇文档重排一遍，
          // 每 5 秒一次）。改成双 rAF：第一帧提交上面的样式，下一帧再上淡入，
          // 视觉效果完全一致，但不再触发强制同步布局。
          requestAnimationFrame(function() {
            requestAnimationFrame(function() {
              quoteInner.style.opacity = '1';
              quoteInner.style.transform = 'translateY(0)';
            });
          });
        }, 550);
      }

      function startQuoteTimer() { stopQuoteTimer(); quoteTimer = setInterval(tickQuote, 5000); }
      function stopQuoteTimer() { if (quoteTimer) { clearInterval(quoteTimer); quoteTimer = null; } }

      if (quotes.length > 1) {
        startQuoteTimer();
        var pauseBtn = document.getElementById('quotePauseBtn');
        if (pauseBtn) {
          pauseBtn.addEventListener('click', function() {
            quotePaused = !quotePaused;
            if (quotePaused) { stopQuoteTimer(); pauseBtn.classList.add('paused'); }
            else { startQuoteTimer(); pauseBtn.classList.remove('paused'); }
          });
        }
      }
    }

    // ===== 页面切换动画 =====
    // 实现在 js/transition.js（全站唯一一份）。这里只传本页的差异参数：
    //   skipSelector —— tab 栏内链接不参与过渡（同层级切换，遮罩会被感知成「卡住」）
    //   leaves: 0    —— 首页的遮罩是素色纱 + 一行文案，不带环绕叶与图标（保持原视觉）
    //   delegate:false —— 与抽取前一致：只给 init 执行时已存在的链接挂监听
    PageTransition.init({
      skipSelector: '.tab-bar',
      leaves: 0,
      initialText: '梧桐叶正落下'
    });

    // ===== 版本号与「检查更新」（仅 App 壳内真正可用）=====
    // 版本号来自原生桥 getAppVersion()；没有桥（浏览器打开）就不显示版本号，
    // 只保留一个可点的「检查更新」并给出「请在 App 内使用」的提示。
    (function () {
      var versionEl = document.getElementById('appVersion');
      var sepEl = document.getElementById('appVersionSep');
      var btn = document.getElementById('checkUpdateBtn');
      if (!btn) return;

      var bridge = window.LinyuanApp;
      if (versionEl) {
        var version = '';
        try {
          if (bridge && typeof bridge.getAppVersion === 'function') {
            version = String(bridge.getAppVersion() || '').trim();
          }
        } catch (err) {
          version = '';
        }
        if (version) {
          versionEl.textContent = 'v' + version;
        } else {
          // 浏览器或老版本壳：不显示版本号，也不显示分隔点
          versionEl.style.display = 'none';
          if (sepEl) sepEl.style.display = 'none';
        }
      }

      var originalText = btn.textContent;
      var resetTimer = null;
      function flashHint(text) {
        btn.textContent = text;
        btn.disabled = true;
        if (resetTimer) clearTimeout(resetTimer);
        resetTimer = setTimeout(function () {
          btn.textContent = originalText;
          btn.disabled = false;
        }, 2200);
      }

      btn.addEventListener('click', function () {
        var app = window.LinyuanApp;
        if (app && typeof app.checkUpdate === 'function') {
          try {
            app.checkUpdate();
            return;
          } catch (err) {
            // 桥存在但调用失败（壳版本过老）：落到提示分支
          }
        }
        flashHint('请在 App 内使用此功能');
      });
    })();

    // ===== 强制刷新（浏览器与 App 通用）=====
    // 为什么要它：App 是 WebView 壳，Pages 给 HTML 的 max-age 是 600 秒，
    // SW 对 CSS/JS 又是缓存优先 —— 刚发完版想立刻看到新内容，只能干等或去
    // 系统设置里清缓存。这里把「清 SW + 清 Cache Storage + 带时间戳重载」
    // 三步合成一次点击。
    //
    // **绝不清 localStorage**：阅读进度、摘句、足迹、主题偏好全在里面，
    // 清缓存的目的只是让「文件」重新下载，不该连「读者的数据」一起丢。
    (function () {
      var btn = document.getElementById('forceRefreshBtn');
      if (!btn) return;
      var originalText = btn.textContent;
      var fired = false;
      var resetTimer = null;

      // 刷新回来后地址栏里会留着 ?r=…，抹掉它（replace 不新增历史记录）
      if (location.search.indexOf('r=') !== -1) {
        try { history.replaceState(null, '', location.pathname); } catch (err) {}
      }

      function go() {
        if (fired) return;
        fired = true;
        // 带唯一查询串：HTML 的 10 分钟 HTTP 缓存按 URL 命中，换 URL 就绕过了
        location.replace('/?r=' + Date.now());
      }

      function hint(text) {
        btn.textContent = text;
        btn.disabled = true;
        if (resetTimer) clearTimeout(resetTimer);
        resetTimer = setTimeout(function () {
          btn.textContent = originalText;
          btn.disabled = false;
        }, 2200);
      }

      btn.addEventListener('click', function () {
        if (btn.disabled) return;
        if (navigator.onLine === false) { hint('当前没有网络'); return; }
        btn.textContent = '正在清理…';
        btn.disabled = true;
        var jobs = [];
        if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
          jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
            return Promise.all(rs.map(function (r) { return r.unregister(); }));
          }).catch(function () {}));
        }
        if (window.caches && caches.keys) {
          jobs.push(caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }).catch(function () {}));
        }
        // 两个清理并行，谁先失败都不拦着刷新；1.5s 兜底，别让人盯着按钮
        Promise.all(jobs).then(go, go);
        setTimeout(go, 1500);
      });
    })();
  })();
  </script>
</body>
</html>
