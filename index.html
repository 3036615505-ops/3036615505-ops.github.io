<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f8f4ed">
  <meta name="description" content="南城的梧桐树还在长">
  <title>临渊羡鱼</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="phone-frame">

  <!-- 首页 Hero -->
  <div class="home-hero">
    <div class="floating-leaves">
      <span></span><span></span><span></span>
    </div>
    <h1>临渊羡鱼</h1>
    <div class="subtitle">青春 · 校园 · 成长</div>
  </div>

  <!-- 引用（多章轮播） -->
  <div class="home-quote" id="homeQuote"></div>

  <!-- 继续阅读卡片 -->
  <div class="home-reading-card" id="homeReadingCard">
    <div class="reading-card-header">
      <span class="reading-card-label">阅读进度</span>
      <span class="reading-card-pct" id="homeReadPct">0%</span>
    </div>
    <div class="reading-card-bar">
      <div class="reading-card-fill" id="homeReadFill"></div>
    </div>
    <div class="reading-card-chapters" id="homeChapterDots"></div>
    <a href="#" class="reading-card-btn" id="homeContinueBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      继续阅读
    </a>
  </div>

  <!-- 书架 -->
  <div class="bookshelf-section">
    <div class="bookshelf-section-title">书架</div>
    <div class="bookshelf">
      <a href="novel/" class="book-item" data-novel-id="linyuan">
        <div class="book-cover linyuan">
          <span class="book-cover-text">临渊羡鱼</span>
        </div>
        <div class="book-title">临渊羡鱼</div>
        <div class="book-author">南城的梧桐树还在长</div>
      </a>
    </div>
  </div>

  <!-- 页脚 -->
  <div class="home-footer">南城的梧桐树还在长</div>

  </div>

  <!-- 页面切换动画 -->
  <div class="page-transition" id="pageTransition">
    <div class="transition-inner">
      <svg viewBox="0 0 40 40" fill="none" width="40" height="40">
        <path class="leaf-path" d="M20 4c0 0-8 4-10 12s4 16 10 20c6-4 12-12 10-20S20 4 20 4z" stroke="var(--accent)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        <path class="leaf-vein" d="M20 8v24M20 14l-4 4M20 14l4 4M20 20l-5 3M20 20l5 3" stroke="var(--accent)" stroke-width="0.8" opacity="0.5" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <script>
  (function() {
    // ===== 引用数据（新增章节时在此添加） =====
    var quotes = [
      {
        // 第一章
        source: '第一章·临渊羡鱼',
        // 段落用数组表示，每段之间会渲染空行
        paragraphs: [
          '梧桐树又落了几片叶子，落在他们刚走过的路上。',
          '蝉在远处拉长了声调叫，好像夏天还没走，好像暑假还没结束。',
          '但那一天其实已经是秋天了。'
        ]
      },
      {
        // 第二章
        source: '第二章·前桌',
        paragraphs: [
          '忽然觉得，来上学这件事好像也没那么讨厌了。'
        ]
      }
      // 新增章节时在此添加更多引用
    ];

    // 引用轮播（5s 切换，淡入淡出）
    var quoteEl = document.getElementById('homeQuote');
    var currentIdx = Math.floor(Math.random() * quotes.length);

    function renderQuote(idx) {
      var q = quotes[idx];
      if (!q) return;
      var html = '<blockquote>';
      q.paragraphs.forEach(function(p) { html += '<p>' + p + '</p>'; });
      html += '</blockquote>';
      html += '<div class="quote-source">—— ' + q.source + '</div>';
      return html;
    }

    if (quoteEl && quotes.length > 0) {
      quoteEl.innerHTML = renderQuote(currentIdx);
      if (quotes.length > 1) {
        setInterval(function() {
          quoteEl.style.opacity = '0';
          setTimeout(function() {
            var next;
            do { next = Math.floor(Math.random() * quotes.length); } while (next === currentIdx && quotes.length > 1);
            currentIdx = next;
            quoteEl.innerHTML = renderQuote(currentIdx);
            quoteEl.style.opacity = '1';
          }, 400);
        }, 5000);
      }
    }

    // ===== 页面切换动画 =====
    var transition = document.getElementById('pageTransition');
    document.querySelectorAll('a[href]').forEach(function(link) {
      link.addEventListener('click', function(e) {
        var href = link.getAttribute('href');
        if (!href || href.startsWith('#') || href.startsWith('javascript')) return;
        e.preventDefault();
        if (transition) transition.classList.add('active');
        setTimeout(function() { window.location.href = href; }, 320);
      });
    });

    // ===== 首页阅读进度 =====
    var chapterInfo = {
      linyuan: [
        { href: 'chapter-01.html', words: 2722, key: '-novel-chapter-01-html', title: '第一章·临渊羡鱼' },
        { href: 'chapter-02.html', words: 2257, key: '-novel-chapter-02-html', title: '第二章·前桌' }
      ]
    };

    var totalRead = 0, totalWords = 0;
    var lastReadChapter = null;
    var lastReadPct = 0;
    var chapterDots = [];

    Object.keys(chapterInfo).forEach(function(novelId) {
      var chapters = chapterInfo[novelId];
      chapters.forEach(function(ch) {
        totalWords += ch.words;
        var pct = parseInt(localStorage.getItem('reader-pos-' + ch.key)) || 0;
        var done = localStorage.getItem('reader-done-' + ch.key) === '1';
        if (done) {
          totalRead += ch.words;
          chapterDots.push('done');
          lastReadChapter = ch.href;
          lastReadPct = 100;
        } else if (pct > 0) {
          totalRead += Math.round(ch.words * pct / 100);
          chapterDots.push('reading');
          if (!lastReadChapter || pct > lastReadPct) {
            lastReadChapter = ch.href;
            lastReadPct = pct;
          }
        } else {
          chapterDots.push('');
        }
      });
    });

    document.querySelectorAll('.book-item').forEach(function(item) {
      var novelId = item.dataset.novelId;
      if (!novelId || !chapterInfo[novelId]) return;
      var chapters = chapterInfo[novelId];
      var nRead = 0, nWords = 0;
      chapters.forEach(function(ch) {
        nWords += ch.words;
        var pct = parseInt(localStorage.getItem('reader-pos-' + ch.key)) || 0;
        var done = localStorage.getItem('reader-done-' + ch.key) === '1';
        if (done) nRead += ch.words;
        else if (pct > 0) nRead += Math.round(ch.words * pct / 100);
      });
      if (nRead <= 0) return;
      var readPct = Math.round(nRead / nWords * 100);
      var cover = item.querySelector('.book-cover');
      if (!cover) return;
      var badge = document.createElement('div');
      badge.className = 'book-progress-badge';
      if (readPct >= 100) {
        badge.className = 'book-progress-badge completed';
        badge.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
      } else {
        badge.textContent = readPct + '%';
      }
      cover.appendChild(badge);
    });

    if (totalRead > 0) {
      var card = document.getElementById('homeReadingCard');
      if (card) {
        card.classList.add('visible');
        var readPct = Math.round(totalRead / totalWords * 100);
        document.getElementById('homeReadPct').textContent = readPct + '%';
        document.getElementById('homeReadFill').style.width = readPct + '%';
        var dotsEl = document.getElementById('homeChapterDots');
        if (dotsEl) {
          var dhtml = '';
          chapterDots.forEach(function(d) { dhtml += '<div class="ch-dot ' + d + '"></div>'; });
          dotsEl.innerHTML = dhtml;
        }
        var btn = document.getElementById('homeContinueBtn');
        if (btn && lastReadChapter) btn.href = 'novel/' + lastReadChapter;
      }
    }
  })();
  </script>
</body>
</html>
