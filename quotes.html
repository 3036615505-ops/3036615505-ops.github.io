  <script>
  (function() {
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function(ch) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch];
      });
    }

    function getStoredQuotes() {
      var raw = localStorage.getItem('reader-quotes');
      if (!raw) return [];
      try { return JSON.parse(raw) || []; } catch (err) { return []; }
    }

    function saveStoredQuotes(quotes) {
      localStorage.setItem('reader-quotes', JSON.stringify(quotes));
      var fpRaw = localStorage.getItem('reader-footprints');
      var fp = {};
      try { fp = JSON.parse(fpRaw) || {}; } catch (err) {}
      fp.quotes = quotes.map(function(item) { return item.id; });
      localStorage.setItem('reader-footprints', JSON.stringify(fp));
    }

    function render() {
      var list = document.getElementById('quotesList');
      if (!list) return;
      var quotes = getStoredQuotes();
      if (!quotes.length) {
        list.innerHTML = '<div class="quotes-empty">还没有收进摘句。<br>等你在某一段前停下来，这里就会亮起来。</div>';
        return;
      }
      list.innerHTML = quotes.slice().reverse().map(function(item) {
        return '<article class="quote-entry">' +
          '<div class="quote-entry-text">' + escapeHtml(item.text) + '</div>' +
          '<div class="quote-entry-meta">—— 《' + escapeHtml(item.chapterTitle || '') + '》</div>' +
          '<div class="quote-entry-actions">' +
            '<a href="novel/' + escapeHtml(item.chapterFile || '') + '#quote-' + escapeHtml(item.index || '0') + '">回到这一页</a>' +
            '<button type="button" data-copy="' + escapeHtml(item.id) + '">复制</button>' +
            '<button type="button" class="danger" data-remove="' + escapeHtml(item.id) + '">移出</button>' +
          '</div>' +
        '</article>';
      }).join('');
    }

    document.getElementById('quotesList').addEventListener('click', function(e) {
      var copyId = e.target.getAttribute && e.target.getAttribute('data-copy');
      var removeId = e.target.getAttribute && e.target.getAttribute('data-remove');
      if (copyId) {
        var q = getStoredQuotes().find(function(item) { return item.id === copyId; });
        if (q && navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(q.text + ' ——《' + q.chapterTitle + '》');
        }
      } else if (removeId) {
        saveStoredQuotes(getStoredQuotes().filter(function(item) { return item.id !== removeId; }));
        render();
      }
    });

    document.getElementById('quotesExportBtn').addEventListener('click', function() {
      var quotes = getStoredQuotes();
      if (!quotes.length) return;
      var lines = ['# 临渊羡鱼 · 摘句簿', '', '> 导出于 ' + new Date().toLocaleString('zh-CN'), ''];
      quotes.forEach(function(item) {
        lines.push('「' + item.text + '」', '', '—— 《' + item.chapterTitle + '》', '');
      });
      var blob = new Blob([lines.join('\n')], { type: 'text/markdown;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '临渊羡鱼-摘句.md';
      document.body.appendChild(a);
      a.click();
      setTimeout(function() { URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 1000);
    });

    render();
  })();
  </script>
</body>
